name: Build Olauncher Fonts3

on:
  push:
    branches: [tmp-olauncher-fonts3-20260823]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct modified Olauncher source
        run: |
          set -euxo pipefail
          mkdir -p work
          git clone https://github.com/tanujnotes/Olauncher.git work/olauncher
          cd work/olauncher
          git checkout 3dc9370c4ea3319f027bcb6be137c000c523d497
          cd ../..
          cat olauncher-builder/payload/part* | base64 -d > overlay-text.tar.gz
          tar -xzf overlay-text.tar.gz -C work/olauncher

      - name: Build Matrix Sans 1.722 fonts
        run: |
          set -euxo pipefail
          git clone https://github.com/FriedOrange/MatrixSans.git work/matrix
          cd work/matrix
          git checkout 18c70530ed9e93bc1322b6dddd012340fac04d68
          make build
          cd ../..
          mkdir -p work/olauncher/app/src/main/res/font
          mkdir -p work/olauncher/app/src/main/assets/licenses
          cp work/matrix/fonts/ttf/MatrixSans-Regular.ttf work/olauncher/app/src/main/res/font/matrix_sans_regular.ttf
          cp work/matrix/fonts/ttf/MatrixSansPrint-Regular.ttf work/olauncher/app/src/main/res/font/matrix_sans_print.ttf
          cp work/matrix/fonts/ttf/MatrixSansScreen-Regular.ttf work/olauncher/app/src/main/res/font/matrix_sans_screen.ttf
          cp work/matrix/fonts/ttf/MatrixSansVideo-Regular.ttf work/olauncher/app/src/main/res/font/matrix_sans_video.ttf
          cp work/matrix/OFL.txt work/olauncher/app/src/main/assets/licenses/MATRIX_SANS_OFL.txt

      - name: Add Ubuntu Sans
        run: |
          set -euxo pipefail
          curl -L --fail 'https://raw.githubusercontent.com/google/fonts/ec626514f79f831f1ab848a82114a0ce7e2d6372/ufl/ubuntusans/UbuntuSans%5Bwdth%2Cwght%5D.ttf' -o work/olauncher/app/src/main/res/font/ubuntu_sans_regular.ttf
          curl -L --fail 'https://raw.githubusercontent.com/google/fonts/ec626514f79f831f1ab848a82114a0ce7e2d6372/ufl/ubuntusans/LICENCE.txt' -o work/olauncher/app/src/main/assets/licenses/UBUNTU_FONT_LICENCE.txt

      - name: Build APK
        working-directory: work/olauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package deliverables
        run: |
          set -euxo pipefail
          mkdir -p deliverables source-stage
          cp work/olauncher/app/build/outputs/apk/debug/app-debug.apk deliverables/Olauncher-Font-Picker-v6.7.1-fonts3.apk
          rm -rf work/olauncher/.git work/olauncher/.gradle work/olauncher/.kotlin work/olauncher/app/build
          cp -a work/olauncher source-stage/olauncher
          (cd source-stage && zip -qr ../deliverables/Olauncher-Font-Picker-v6.7.1-fonts3-source.zip olauncher)
          (cd deliverables && sha256sum *.apk *.zip > Olauncher-Font-Picker-v6.7.1-fonts3-SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: olauncher-fonts3
          path: deliverables/
          if-no-files-found: error
          retention-days: 7
