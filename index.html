<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PokéDex Card Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --red-dark: #a80009;
  --body-red: #cc1020;
  --hinge: #8a0009;
  --btn-yellow: #f5c800;
  --btn-blue: #0055cc;
  --btn-green: #00a830;
  --screen-bg: #1a1e2a;
  --screen-on: #c8e864;
  --screen-dim: #6a8c2a;
  --text: #e8f0ff;
  --text-dim: #8090b0;
  --text-dimmer: #3a4460;
  --border: #2a3050;
  --surface: #141826;
  --surface2: #1e2438;
  --owned-glow: #3dff7a;
  --accent: #ffe040;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0d0f18; min-height: 100vh; font-family: 'Nunito', sans-serif; overflow-x: hidden; color: var(--text); }

/* ── LOADING SCREEN ── */
#loadingScreen {
  position: fixed; inset: 0; background: var(--body-red);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 999;
}
.loading-icon {
  width: 60px; height: 60px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #a0e8ff, #0099dd 50%, #006699);
  border: 4px solid white; box-shadow: 0 0 30px rgba(0,180,255,0.9);
  animation: bigpulse 1s ease-in-out infinite;
}
@keyframes bigpulse { 0%,100%{box-shadow:0 0 20px rgba(0,180,255,0.8);}50%{box-shadow:0 0 40px rgba(0,200,255,1);} }
.loading-title { font-family:'Press Start 2P',monospace; font-size:14px; color:white; letter-spacing:2px; }
.loading-bar-outer { width:240px; height:8px; background:rgba(0,0,0,0.4); border-radius:99px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
.loading-bar-inner { height:100%; background:linear-gradient(90deg,#fff8c0,#ffe040); border-radius:99px; width:0%; transition:width 0.2s ease; }
.loading-status { font-family:'Share Tech Mono',monospace; font-size:11px; color:rgba(255,220,220,0.9); }
.loading-substatus { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(255,200,200,0.5); }
#retryBtn { display:none; font-family:'Press Start 2P',monospace; font-size:9px; padding:10px 20px; background:#ffe040; color:#000; border:none; border-radius:6px; cursor:pointer; margin-top:8px; }

/* ── SHELL ── */
.pokedex-shell { max-width:480px; margin:0 auto; height:100dvh; background:var(--body-red); box-shadow:inset -6px 0 0 var(--hinge),inset 6px 0 0 rgba(255,100,100,0.2),0 0 60px rgba(200,0,20,0.3); display:flex; flex-direction:column; overflow:hidden; }

/* ── TOP STRIP ── */
.dex-top { background:var(--red-dark); padding:12px 16px 8px; display:flex; align-items:center; gap:12px; border-bottom:3px solid var(--hinge); flex-shrink:0; }
.dex-big-light { width:36px; height:36px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#a0e8ff,#0099dd 50%,#006699); border:3px solid white; box-shadow:0 0 12px rgba(0,180,255,0.8); flex-shrink:0; animation:bigpulse 3s ease-in-out infinite; }
.dex-small-lights { display:flex; gap:6px; align-items:center; }
.small-light { width:14px; height:14px; border-radius:50%; border:2px solid rgba(0,0,0,0.3); }
.sl-red { background:radial-gradient(circle at 35% 35%,#ff8080,#dd0000); box-shadow:0 0 6px #f00; }
.sl-yellow { background:radial-gradient(circle at 35% 35%,#ffff80,#ddaa00); box-shadow:0 0 6px #fc0; }
.sl-green { background:radial-gradient(circle at 35% 35%,#80ff80,#00aa00); box-shadow:0 0 6px #0f0; }
.dex-title { font-family:'Press Start 2P',monospace; font-size:8px; color:rgba(255,200,200,0.7); letter-spacing:1px; margin-left:auto; text-align:right; line-height:1.8; }

/* ── SCREEN ── */
.dex-screen-frame { background:var(--red-dark); padding:12px 16px; flex:1; min-height:0; display:flex; flex-direction:column; }
.dex-screen-outer { background:#111; border-radius:6px 6px 0 0; padding:8px; border:3px solid #0a0a0a; box-shadow:inset 0 4px 12px rgba(0,0,0,0.8); flex:1; min-height:0; display:flex; flex-direction:column; }
.dex-screen { background:var(--screen-bg); border-radius:4px; overflow:hidden; position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
.dex-screen::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0.05) 4px); pointer-events:none; z-index:50; }

.screen-header { background:var(--surface); padding:10px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.dex-logo { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--accent); line-height:1.7; }
.dex-logo span { color:var(--text-dim); font-size:7px; }
.progress-section { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
.progress-nums { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--screen-on); }
.progress-bar-wrap { width:90px; height:5px; background:var(--border); border-radius:99px; overflow:hidden; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--screen-dim),var(--screen-on)); border-radius:99px; transition:width 0.5s ease; }

.screen-controls { background:var(--surface); border-bottom:1px solid var(--border); padding:7px 10px; display:flex; gap:5px; overflow-x:auto; flex-shrink:0; }
.search-wrap { position:relative; flex:1; min-width:100px; }
.search-wrap input, .dex-select { width:100%; background:var(--screen-bg); border:1px solid var(--border); color:var(--text); font-family:'Share Tech Mono',monospace; font-size:11px; padding:6px 7px 6px 24px; border-radius:4px; outline:none; }
.search-wrap input:focus, .dex-select:focus { border-color:var(--screen-on); }
.search-wrap input::placeholder { color:var(--text-dimmer); }
.search-icon { position:absolute; left:7px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:12px; pointer-events:none; }
.dex-select { padding:6px 7px; cursor:pointer; min-width:70px; flex:0 0 auto; }

/* ── QUICK DRAWER ── */
.quick-drawer { background:var(--surface); border-top:1px solid var(--border); overflow:hidden; max-height:0; transition:max-height 0.3s ease; }
.quick-drawer.open { max-height:200px; }
.quick-inner { padding:10px 12px; }
.quick-title { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--text-dim); letter-spacing:1px; margin-bottom:7px; }
.quick-row { display:flex; gap:7px; align-items:flex-start; }
.quick-row textarea { flex:1; min-height:55px; background:var(--screen-bg); border:1px solid var(--border); color:var(--text); font-family:'Share Tech Mono',monospace; font-size:11px; padding:7px; border-radius:4px; outline:none; resize:none; }
.quick-row textarea:focus { border-color:var(--screen-on); }
.quick-row textarea::placeholder { color:var(--text-dimmer); }
.quick-btns { display:flex; flex-direction:column; gap:4px; }
.quick-hint { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dimmer); margin-top:4px; }

/* ── GRID ── */
.screen-grid-area { padding:8px 10px; flex:1; min-height:0; overflow-y:auto; }
.gen-label { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--text-dimmer); margin:10px 0 6px; display:flex; align-items:center; gap:8px; }
.gen-label::after { content:''; flex:1; height:1px; background:var(--border); }
.poke-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:5px; }
.poke-card { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:6px 4px 5px; cursor:pointer; transition:all 0.12s; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; user-select:none; }
.poke-card:hover { border-color:var(--accent); box-shadow:0 0 8px rgba(255,224,64,0.3); transform:translateY(-1px); }
.poke-card.owned { border-color:var(--owned-glow); background:color-mix(in srgb,var(--surface2) 80%,rgba(61,255,122,0.15)); box-shadow:0 0 6px rgba(61,255,122,0.2); }
.poke-card.owned::after { content:'✓'; position:absolute; top:3px; right:5px; color:var(--owned-glow); font-size:10px; font-weight:900; }
.poke-num { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--text-dimmer); }
.poke-sprite-wrap { width:54px; height:54px; display:flex; align-items:center; justify-content:center; }
.poke-sprite { width:54px; height:54px; image-rendering:pixelated; transition:filter 0.12s,transform 0.12s; }
.poke-card:not(.owned) .poke-sprite { filter:brightness(0.22) saturate(0); }
.poke-card.owned .poke-sprite { filter:drop-shadow(0 1px 5px rgba(61,255,122,0.25)); }
.poke-card:hover .poke-sprite { transform:scale(1.08); filter:brightness(1) saturate(1) drop-shadow(0 1px 6px rgba(255,224,64,0.5)); }
.poke-name { font-size:8px; font-family:'Share Tech Mono',monospace; text-align:center; color:var(--text-dim); text-transform:capitalize; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.poke-card.owned .poke-name { color:var(--text); }
.type-dots { display:flex; gap:2px; }
.type-dot { width:5px; height:5px; border-radius:50%; }
.empty-state { text-align:center; padding:40px 20px; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-dimmer); }

/* ── BOTTOM ── */
.dex-bottom { background:var(--red-dark); padding:10px 16px 12px; border-top:3px solid var(--hinge); display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.btn-row { display:flex; gap:6px; }
.dex-btn { font-family:'Press Start 2P',monospace; font-size:7px; padding:7px 8px; border-radius:4px; border:none; cursor:pointer; transition:all 0.1s; line-height:1.4; flex:1; text-align:center; }
.dex-btn:active { transform:scale(0.95); }
.dex-btn.yellow { background:var(--btn-yellow); color:#1a0800; box-shadow:0 3px 0 #a88000; }
.dex-btn.yellow:hover { background:#ffe060; }
.dex-btn.blue { background:var(--btn-blue); color:#fff; box-shadow:0 3px 0 #003388; }
.dex-btn.blue:hover { background:#0066ee; }
.dex-btn.green { background:var(--btn-green); color:#fff; box-shadow:0 3px 0 #006620; }
.dex-btn.green:hover { background:#00bb38; }
.dex-btn.gray { background:#444; color:#ccc; box-shadow:0 3px 0 #222; }
.dex-btn.gray:hover { background:#555; }
.stats-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.stat-chip { font-family:'Share Tech Mono',monospace; font-size:10px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:3px 10px; color:var(--text-dim); }
.stat-chip .val { color:var(--screen-on); }
.stat-chip.owned-chip .val { color:var(--owned-glow); }
.dex-decor { display:flex; align-items:center; justify-content:center; gap:20px; }
.dpad { width:48px; height:48px; position:relative; }
.dpad-h,.dpad-v { position:absolute; background:#1a1a1a; border-radius:2px; }
.dpad-h { width:100%; height:33%; top:33%; left:0; }
.dpad-v { width:33%; height:100%; top:0; left:33%; }
.dpad-center { position:absolute; width:33%; height:33%; top:33%; left:33%; background:#111; border-radius:50%; }
.ab-btns { display:flex; gap:6px; align-items:center; }
.circle-btn { width:20px; height:20px; border-radius:50%; border:none; pointer-events:none; }
.circle-btn.a { background:radial-gradient(circle at 35% 35%,#ff6060,#cc0000); box-shadow:0 2px 0 #800; }
.circle-btn.b { background:radial-gradient(circle at 35% 35%,#f0f060,#aaaa00); box-shadow:0 2px 0 #660; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:300; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--surface); border:2px solid var(--border); border-bottom:none; border-radius:12px 12px 0 0; width:100%; max-width:480px; overflow:hidden; transform:translateY(100%); transition:transform 0.25s cubic-bezier(0.34,1.2,0.64,1); position:relative; }
.modal-overlay.open .modal { transform:translateY(0); }
.modal-drag { width:40px; height:4px; background:var(--border); border-radius:99px; margin:10px auto 0; }
.modal-header { padding:12px 16px 0; display:flex; align-items:flex-start; gap:14px; }
.modal-sprite-bg { width:90px; height:90px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--screen-bg); border:1px solid var(--border); }
.modal-sprite { width:90px; height:90px; image-rendering:pixelated; }
.modal-info { flex:1; padding-top:4px; }
.modal-num { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-dim); margin-bottom:2px; }
.modal-name { font-family:'Press Start 2P',monospace; font-size:12px; text-transform:capitalize; line-height:1.4; margin-bottom:8px; }
.type-badges { display:flex; gap:5px; flex-wrap:wrap; }
.type-badge { font-family:'Share Tech Mono',monospace; font-size:9px; padding:3px 8px; border-radius:3px; font-weight:bold; letter-spacing:0.5px; text-transform:uppercase; color:#000; }
.modal-close { position:absolute; top:12px; right:12px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; font-family:monospace; }
.modal-close:hover { color:var(--text); }
.modal-body { padding:12px 16px 16px; }
.modal-desc { font-size:11px; color:var(--text-dim); line-height:1.7; margin-bottom:10px; min-height:44px; background:var(--screen-bg); border-radius:4px; padding:8px 10px; border-left:2px solid var(--screen-dim); font-family:'Share Tech Mono',monospace; }
.modal-stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-bottom:12px; }
.stat-box { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:5px 4px; text-align:center; }
.stat-box .s-label { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--text-dimmer); display:block; }
.stat-box .s-val { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--screen-on); display:block; margin-top:2px; }
.modal-toggle { width:100%; padding:11px; font-family:'Press Start 2P',monospace; font-size:8px; letter-spacing:1px; border-radius:6px; border:2px solid var(--border); background:transparent; color:var(--text-dim); cursor:pointer; transition:all 0.15s; line-height:1.5; }
.modal-toggle:hover { border-color:var(--accent); color:var(--accent); }
.modal-toggle.owned { border-color:var(--owned-glow); color:var(--owned-glow); }
.modal-toggle.owned:hover { border-color:#ff6060; color:#ff6060; }

/* ── TOAST ── */
.toast { position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-60px); background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:11px; font-family:'Share Tech Mono',monospace; padding:8px 16px; border-radius:99px; z-index:500; white-space:nowrap; opacity:0; transition:all 0.25s; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.success { border-color:var(--owned-glow); color:var(--owned-glow); }
.toast.error { border-color:#ff6060; color:#ff6060; }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
</style>
</head>
<body>

<!-- ── LOADING ── -->
<div id="loadingScreen">
  <div class="loading-icon"></div>
  <div class="loading-title">POKÉDEX</div>
  <div class="loading-bar-outer"><div class="loading-bar-inner" id="loadingBar"></div></div>
  <div class="loading-status" id="loadingStatus">connecting to pokéapi...</div>
  <div class="loading-substatus" id="loadingSubstatus">&nbsp;</div>
  <button id="retryBtn" onclick="startFetch()">RETRY</button>
</div>

<!-- ── APP ── -->
<div class="pokedex-shell" id="mainApp" style="display:none">
  <div class="dex-top">
    <div class="dex-big-light"></div>
    <div class="dex-small-lights">
      <div class="small-light sl-red"></div>
      <div class="small-light sl-yellow"></div>
      <div class="small-light sl-green"></div>
    </div>
    <div class="dex-title">CARD TRACKER<br><span style="color:rgba(255,200,200,0.4);font-size:7px">v3.1 — 1028</span></div>
  </div>

  <div class="dex-screen-frame">
    <div class="dex-screen-outer">
      <div class="dex-screen">
        <div class="screen-header">
          <div><div class="dex-logo">POKÉDEX <span>CARDS</span></div></div>
          <div class="progress-section">
            <div class="progress-nums"><span id="ownedCount">0</span> / <span id="totalCount">0</span></div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
          </div>
        </div>

        <div class="screen-controls">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="searchBox" placeholder="search...">
          </div>
          <select class="dex-select" id="filterSelect">
            <option value="all">ALL</option>
            <option value="owned">OWNED</option>
            <option value="missing">MISSING</option>
          </select>
          <select class="dex-select" id="genFilter">
            <option value="all">GEN</option>
            <option value="1">G1</option><option value="2">G2</option><option value="3">G3</option>
            <option value="4">G4</option><option value="5">G5</option><option value="6">G6</option>
            <option value="7">G7</option><option value="8">G8</option><option value="9">G9</option>
          </select>
          <select class="dex-select" id="typeFilter"><option value="all">TYPE</option></select>
        </div>

        <div class="quick-drawer" id="quickDrawer">
          <div class="quick-inner">
            <div class="quick-title">QUICK INPUT</div>
            <div class="quick-row">
              <div style="flex:1">
                <textarea id="quickBox" placeholder="bulbasaur, pikachu&#10;#001, #025&#10;one per line ok too"></textarea>
                <div class="quick-hint">names or #numbers, comma/newline sep.</div>
              </div>
              <div class="quick-btns">
                <button class="dex-btn green" id="quickAdd">ADD</button>
                <button class="dex-btn gray" id="quickRemove">REM</button>
              </div>
            </div>
          </div>
        </div>

        <div class="screen-grid-area" id="gridArea"></div>
      </div>
    </div>
  </div>

  <div class="dex-bottom">
    <div class="stats-row">
      <div class="stat-chip owned-chip">OWNED: <span class="val" id="statOwned">0</span></div>
      <div class="stat-chip">MISSING: <span class="val" id="statMissing">0</span></div>
      <div class="stat-chip"><span class="val" id="statPct">0%</span></div>
    </div>
    <div class="btn-row">
      <button class="dex-btn yellow" id="quickInputToggle">INPUT</button>
      <button class="dex-btn blue" id="exportBtn">SAVE</button>
      <button class="dex-btn green" onclick="document.getElementById('importFile').click()">LOAD</button>
      <button class="dex-btn gray" id="clearBtn">CLEAR</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div class="dex-decor">
      <div class="dpad"><div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div></div>
      <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:rgba(255,200,200,0.2);letter-spacing:2px">POKÉDEX</div>
      <div class="ab-btns"><div class="circle-btn b"></div><div class="circle-btn a"></div></div>
    </div>
  </div>
</div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-drag"></div>
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-header">
      <div class="modal-sprite-bg"><img class="modal-sprite" id="modalSprite" src="" alt=""></div>
      <div class="modal-info">
        <div class="modal-num" id="modalNum">#001</div>
        <div class="modal-name" id="modalName">BULBASAUR</div>
        <div class="type-badges" id="modalTypes"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-desc" id="modalDesc">—</div>
      <div class="modal-stats-grid" id="modalStats"></div>
      <button class="modal-toggle" id="modalToggleBtn">+ MARK AS OWNED</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────────
const API        = 'https://pokeapi.co/api/v2';
const TOTAL      = 1028;                     // updated: Z-A added #1026-1028
const CACHE_KEY  = 'pokedex_data_v4';       // full pokemon list cache (bumped for 1028)
const OWNED_KEY  = 'pokedex_owned_v3';      // owned set
const CACHE_TTL  = 7 * 24 * 60 * 60 * 1000; // 1 week
const BATCH_SIZE = 50;                       // parallel requests per round

const TC = {fire:'#f97316',water:'#38bdf8',grass:'#4ade80',electric:'#facc15',psychic:'#f472b6',ice:'#67e8f9',dragon:'#818cf8',dark:'#7c5c9a',fairy:'#f9a8d4',fighting:'#fb923c',poison:'#c084fc',ground:'#d97706',flying:'#93c5fd',bug:'#86efac',rock:'#a8a29e',ghost:'#9f7aea',steel:'#94a3b8',normal:'#9ca3af'};

const GENS = [
  {g:1,l:'Generation I — Kanto',s:1,e:151},
  {g:2,l:'Generation II — Johto',s:152,e:251},
  {g:3,l:'Generation III — Hoenn',s:252,e:386},
  {g:4,l:'Generation IV — Sinnoh',s:387,e:493},
  {g:5,l:'Generation V — Unova',s:494,e:649},
  {g:6,l:'Generation VI — Kalos',s:650,e:721},
  {g:7,l:'Generation VII — Alola',s:722,e:809},
  {g:8,l:'Generation VIII — Galar',s:810,e:905},
  {g:9,l:'Generation IX — Paldea / Legends: Z-A',s:906,e:1028},
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let allPokemon = [];
let owned = new Set();
const flavorCache = {};
const statsCache  = {};

// ─────────────────────────────────────────────
//  OWNED STORAGE
// ─────────────────────────────────────────────
function saveOwned() {
  localStorage.setItem(OWNED_KEY, JSON.stringify([...owned]));
  updateStats();
}

function loadOwned() {
  try {
    const r = localStorage.getItem(OWNED_KEY);
    if (r) owned = new Set(JSON.parse(r));
  } catch {}
}

// ─────────────────────────────────────────────
//  FETCH ALL POKEMON (with caching + progress)
// ─────────────────────────────────────────────
function setStatus(main, sub='') {
  document.getElementById('loadingStatus').textContent    = main;
  document.getElementById('loadingSubstatus').textContent = sub;
}

function setBar(pct) {
  document.getElementById('loadingBar').style.width = Math.min(100, pct) + '%';
}

async function fetchBatch(urls) {
  return Promise.all(urls.map(async url => {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
    return r.json();
  }));
}

async function startFetch() {
  document.getElementById('retryBtn').style.display = 'none';
  setBar(0);

  // ── Try cache first ──
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const { ts, data } = JSON.parse(cached);
      if (Date.now() - ts < CACHE_TTL && Array.isArray(data) && data.length >= TOTAL) {
        allPokemon = data;
        setStatus(`loaded ${allPokemon.length} pokémon from cache`, 'instant load from browser storage ✓');
        setBar(100);
        setTimeout(bootApp, 600);
        return;
      }
    }
  } catch {}

  // ── Live fetch ──
  try {
    setStatus('fetching pokémon list...', `contacting pokeapi.co`);

    const listRes = await fetch(`${API}/pokemon?limit=${TOTAL}&offset=0`);
    if (!listRes.ok) throw new Error('list fetch failed');
    const listJson = await listRes.json();
    const urls = listJson.results.map(p => p.url);

    setBar(5);
    setStatus(`loading ${urls.length} pokémon...`, 'this takes ~15s on first load');

    const results = [];
    for (let i = 0; i < urls.length; i += BATCH_SIZE) {
      const batch = await fetchBatch(urls.slice(i, i + BATCH_SIZE));

      batch.forEach((d, bi) => {
        const id = i + bi + 1;
        results.push({
          id,
          name: d.name,
          types: d.types.map(t => t.type.name),
          sprite: d.sprites.front_default
            || d.sprites?.other?.['official-artwork']?.front_default
            || '',
        });
      });

      const pct = 5 + Math.round((results.length / urls.length) * 90);
      setBar(pct);
      setStatus(
        `loading pokémon... ${results.length}/${urls.length}`,
        `batch ${Math.ceil((i + BATCH_SIZE) / BATCH_SIZE)} of ${Math.ceil(urls.length / BATCH_SIZE)}`
      );
    }

    allPokemon = results;

    // Save to cache
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: allPokemon }));
    } catch (e) {
      // localStorage full — skip caching
      console.warn('Could not cache pokemon data:', e);
    }

    setBar(100);
    setStatus(`${allPokemon.length} pokémon loaded!`, 'saved to browser storage — next load is instant ✓');
    setTimeout(bootApp, 700);

  } catch (err) {
    setStatus('connection error :(', err.message);
    document.getElementById('retryBtn').style.display = 'block';
  }
}

function bootApp() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = '';
  buildTypeFilter();
  updateStats();
  renderGrid();
}

// ─────────────────────────────────────────────
//  TYPE FILTER OPTIONS
// ─────────────────────────────────────────────
function buildTypeFilter() {
  const types = [...new Set(allPokemon.flatMap(p => p.types))].sort();
  const sel   = document.getElementById('typeFilter');
  types.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t.toUpperCase();
    sel.appendChild(o);
  });
}

// ─────────────────────────────────────────────
//  FILTER
// ─────────────────────────────────────────────
function getFiltered() {
  const q      = document.getElementById('searchBox').value.toLowerCase().trim();
  const filter = document.getElementById('filterSelect').value;
  const gen    = document.getElementById('genFilter').value;
  const type   = document.getElementById('typeFilter').value;

  return allPokemon.filter(p => {
    if (q) {
      const mn = p.name.includes(q);
      const mi = ('#' + String(p.id).padStart(3,'0')).includes(q) || String(p.id) === q;
      if (!mn && !mi) return false;
    }
    if (filter === 'owned'   && !owned.has(p.id)) return false;
    if (filter === 'missing' &&  owned.has(p.id)) return false;
    if (gen !== 'all') {
      const g = GENS.find(g => g.g === parseInt(gen));
      if (g && (p.id < g.s || p.id > g.e)) return false;
    }
    if (type !== 'all' && !p.types.includes(type)) return false;
    return true;
  });
}

// ─────────────────────────────────────────────
//  RENDER GRID
// ─────────────────────────────────────────────
function renderGrid() {
  const area      = document.getElementById('gridArea');
  const filtered  = getFiltered();
  const genFilter = document.getElementById('genFilter').value;
  area.innerHTML  = '';

  if (!filtered.length) {
    area.innerHTML = '<div class="empty-state">NO POKÉMON FOUND</div>';
    return;
  }

  let curGen = -1, curGrid = null;
  const showLabels = genFilter === 'all';

  filtered.forEach(p => {
    const pGen = GENS.find(g => p.id >= g.s && p.id <= g.e);
    const gn   = pGen ? pGen.g : 0;

    if (showLabels && gn !== curGen) {
      curGen = gn;
      const lbl = document.createElement('div');
      lbl.className   = 'gen-label';
      lbl.textContent = pGen ? pGen.l : '???';
      area.appendChild(lbl);
      curGrid = document.createElement('div');
      curGrid.className = 'poke-grid';
      area.appendChild(curGrid);
    } else if (!curGrid) {
      curGrid = document.createElement('div');
      curGrid.className = 'poke-grid';
      area.appendChild(curGrid);
    }

    const card = document.createElement('div');
    card.className  = 'poke-card' + (owned.has(p.id) ? ' owned' : '');
    card.dataset.id = p.id;
    card.innerHTML  = `
      <div class="poke-num">#${String(p.id).padStart(3,'0')}</div>
      <div class="poke-sprite-wrap">
        <img class="poke-sprite" src="${p.sprite}" alt="${p.name}" loading="lazy" onerror="this.style.opacity='0.08'">
      </div>
      <div class="poke-name">${p.name}</div>
      <div class="type-dots">${p.types.map(t => `<div class="type-dot" style="background:${TC[t]||'#888'}" title="${t}"></div>`).join('')}</div>
    `;
    card.addEventListener('click', () => openModal(p.id));
    curGrid.appendChild(card);
  });
}

// ─────────────────────────────────────────────
//  STATS BAR
// ─────────────────────────────────────────────
function updateStats() {
  const total = allPokemon.length;
  const n     = owned.size;
  const pct   = total ? Math.round(n / total * 100) : 0;
  document.getElementById('ownedCount').textContent = n;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('statOwned').textContent  = n;
  document.getElementById('statMissing').textContent = total - n;
  document.getElementById('statPct').textContent    = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// ─────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────
async function openModal(id) {
  const p = allPokemon.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalNum').textContent   = '#' + String(p.id).padStart(3,'0');
  document.getElementById('modalName').textContent  = p.name.toUpperCase();
  document.getElementById('modalSprite').src        = p.sprite;
  document.getElementById('modalTypes').innerHTML   = p.types.map(t =>
    `<span class="type-badge" style="background:${TC[t]||'#888'}">${t}</span>`).join('');
  setModalBtn(id);

  document.getElementById('modalDesc').textContent     = 'loading...';
  document.getElementById('modalStats').innerHTML      = '';

  // Fetch species + stats (lazily, cached)
  try {
    if (!flavorCache[id]) {
      const r = await fetch(`${API}/pokemon-species/${id}`);
      const d = await r.json();
      const e = d.flavor_text_entries.find(e => e.language.name === 'en');
      flavorCache[id] = e ? e.flavor_text.replace(/[\f\n\r]/g, ' ') : 'No description available.';
    }
    if (!statsCache[id]) {
      const r = await fetch(`${API}/pokemon/${id}`);
      const d = await r.json();
      statsCache[id] = {
        hp:  d.stats.find(s => s.stat.name === 'hp')?.base_stat,
        atk: d.stats.find(s => s.stat.name === 'attack')?.base_stat,
        def: d.stats.find(s => s.stat.name === 'defense')?.base_stat,
        spa: d.stats.find(s => s.stat.name === 'special-attack')?.base_stat,
        spd: d.stats.find(s => s.stat.name === 'special-defense')?.base_stat,
        spe: d.stats.find(s => s.stat.name === 'speed')?.base_stat,
        ht:  (d.height / 10).toFixed(1) + 'm',
        wt:  (d.weight / 10).toFixed(1) + 'kg',
      };
    }

    document.getElementById('modalDesc').textContent = flavorCache[id];
    const s = statsCache[id];
    document.getElementById('modalStats').innerHTML =
      [['HP',s.hp],['ATK',s.atk],['DEF',s.def],['SPA',s.spa],['SPD',s.spd],['SPE',s.spe],['HT',s.ht],['WT',s.wt]]
      .map(([l,v]) => `<div class="stat-box"><span class="s-label">${l}</span><span class="s-val">${v}</span></div>`)
      .join('');
  } catch {
    document.getElementById('modalDesc').textContent = 'Could not load info — check connection.';
  }
}

function setModalBtn(id) {
  const btn = document.getElementById('modalToggleBtn');
  btn.className = 'modal-toggle' + (owned.has(id) ? ' owned' : '');
  btn.textContent = owned.has(id) ? '✓ OWNED — TAP TO REMOVE' : '+ MARK AS OWNED';
  btn.onclick = () => { toggleOwned(id); setModalBtn(id); };
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function toggleOwned(id) {
  owned.has(id) ? owned.delete(id) : owned.add(id);
  saveOwned();
  const card = document.querySelector(`.poke-card[data-id="${id}"]`);
  if (card) card.classList.toggle('owned', owned.has(id));
}

// ─────────────────────────────────────────────
//  QUICK INPUT
// ─────────────────────────────────────────────
function parseInput(raw) {
  const tokens = raw.split(/[\n,]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
  const found = [], notFound = [];
  tokens.forEach(t => {
    const nm = t.match(/^#?(\d+)$/);
    const p  = nm
      ? allPokemon.find(x => x.id === parseInt(nm[1]))
      : allPokemon.find(x => x.name === t);
    p ? found.push(p.id) : notFound.push(t);
  });
  return { found, notFound };
}

document.getElementById('quickAdd').addEventListener('click', () => {
  const { found, notFound } = parseInput(document.getElementById('quickBox').value);
  found.forEach(id => owned.add(id));
  saveOwned(); renderGrid();
  showToast(`Added ${found.length}${notFound.length ? ` (${notFound.length} not found)` : ''}`,
    notFound.length ? '' : 'success');
  document.getElementById('quickBox').value = '';
});

document.getElementById('quickRemove').addEventListener('click', () => {
  const { found } = parseInput(document.getElementById('quickBox').value);
  found.forEach(id => owned.delete(id));
  saveOwned(); renderGrid();
  showToast(`Removed ${found.length}`, 'success');
  document.getElementById('quickBox').value = '';
});

// ─────────────────────────────────────────────
//  IMPORT / EXPORT
// ─────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({
    version: 3,
    exported: new Date().toISOString(),
    owned: [...owned].sort((a,b) => a-b),
    count: owned.size,
  }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pokedex_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('Collection saved!', 'success');
});

document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d   = JSON.parse(await f.text());
    const ids = Array.isArray(d.owned) ? d.owned : Array.isArray(d) ? d : [];
    ids.forEach(id => { if (typeof id === 'number') owned.add(id); });
    saveOwned(); renderGrid();
    showToast(`Loaded ${ids.length} pokémon!`, 'success');
  } catch { showToast('Invalid file', 'error'); }
  e.target.value = '';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Clear your whole collection?')) return;
  owned.clear(); saveOwned(); renderGrid();
  showToast('Collection cleared', 'error');
});

// ─────────────────────────────────────────────
//  UI WIRING
// ─────────────────────────────────────────────
document.getElementById('quickInputToggle').addEventListener('click', () => {
  document.getElementById('quickDrawer').classList.toggle('open');
});

['searchBox','filterSelect','genFilter','typeFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input',  renderGrid);
  document.getElementById(id).addEventListener('change', renderGrid);
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ─────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2800);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
loadOwned();
startFetch();
</script>
</body>
</html>
